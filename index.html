<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Laptop World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#111;
    color:#fff;
}
.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}
h1{
    margin-bottom:20px;
}
p{
    text-align:center;
    margin-bottom:20px;
}

.btn{
    width:250px;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    text-decoration:none;
    display:block;
    text-align:center;
}

.youtube{
    background:#ff0000;
}

.instagram{
    background:#E1306C;
}

.continue{
    background:#00b894;
}

.download{
    background:#ff9800;
}

img{
    width:300px;
    max-width:90%;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 20px #000;
}

#page2{
    display:none;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page" id="page1">

<h1>Welcome</h1>

<p>
Follow our YouTube and Instagram before downloading.
</p>

<a class="btn youtube"
href="https://youtube.com/@digitallaptopworld?si=j41suFX_9Cy_2ger"
target="_blank">
📺 YouTube
</a>

<a class="btn instagram"
href="https://www.instagram.com/digital_laptop_world/"
target="_blank">
📷 Instagram
</a>

<button class="btn continue"
onclick="nextPage()">
Continue →
</button>

</div>

<!-- PAGE 2 -->

<div class="page" id="page2">

<img src="<img src="gta.jpg">">

<h2>GTA Vice City</h2>

<p>
Click the button below to download from the official website.
</p>

<a class="btn download"
href="https://t.me/digitallaptopworld"
target="_blank">
⬇ Download
</a>
</div>

<script>

function nextPage(){
document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";
}

</script>

</body>
</html>
