<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Laptop World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
}

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

p{
    text-align:center;
    margin-bottom:20px;
}

.btn{
    width:250px;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    text-decoration:none;
    display:block;
    text-align:center;
}

.youtube{
    background:#ff0000;
}

.instagram{
    background:#E1306C;
}

.continue{
    background:#00b894;
}

.download{
    background:#ff9800;
}

img{
    width:300px;
    max-width:90%;
    border-radius:15px;
    margin-bottom:20px;
}

#page2{
    display:none;
}

</style>
</head>

<body>

<!-- FIRST PAGE -->

<div class="page" id="page1">

<h1>Welcome</h1>

<p>
Follow YouTube and Instagram to continue
</p>

<a class="btn youtube"
href="https://youtube.com/@digitallaptopworld?si=j41suFX_9Cy_2ger"
target="_blank"
onclick="youtubeDone()">
📺 YouTube
</a>


<a class="btn instagram"
href="https://www.instagram.com/digital_laptop_world/"
target="_blank"
onclick="instagramDone()">
📷 Instagram
</a>


<button class="btn continue"
id="continueBtn"
onclick="nextPage()"
style="display:none;">
Continue →
</button>

</div>



<!-- SECOND PAGE -->

<div class="page" id="page2">

<img src="images/gta.jpg" alt="GTA Thumbnail">

<h2>GTA Vice City</h2>

<p>
Click below to download
</p>


<a class="btn download"
href="https://t.me/digitallaptopworld"
target="_blank">
⬇ Download
</a>


</div>



<script>

let youtube = false;
let instagram = false;


function youtubeDone(){
    youtube = true;
    check();
}


function instagramDone(){
    instagram = true;
    check();
}


function check(){

    if(youtube && instagram){

        document.getElementById("continueBtn").style.display="block";

    }

}


function nextPage(){

document.getElementById("page1").style.display="none";

document.getElementById("page2").style.display="flex";

}

</script>


</body>
</html>
